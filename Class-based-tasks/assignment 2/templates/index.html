<!DOCTYPE html>
<html>
<head>
    <title>Customer Churn Prediction</title>
</head>
<body>

    <h1>Customer Churn Prediction</h1>

    <form id="predictionForm">

        <label>Age:</label>
        <input type="number" id="Age" required>
        <br><br>

        <label>Monthly Spend:</label>
        <input type="number" id="MonthlySpend" required>
        <br><br>

        <label>City:</label>
        <select id="City">
            <option value="Lahore">Lahore</option>
            <option value="Karachi">Karachi</option>
        </select>
        <br><br>

        <label>Contract:</label>
        <select id="Contract">
            <option value="Monthly">Monthly</option>
            <option value="Yearly">Yearly</option>
        </select>
        <br><br>

        <label>Join Year:</label>
        <input type="number" id="JoinYear" required>
        <br><br>

        <label>Join Month:</label>
        <input type="number" id="JoinMonth" required>
        <br><br>

        <button type="submit">Predict</button>

    </form>

    <h2 id="result"></h2>

    <script>
        document.getElementById("predictionForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const data = {
                Age: Number(document.getElementById("Age").value),
                MonthlySpend: Number(document.getElementById("MonthlySpend").value),
                City: document.getElementById("City").value,
                Contract: document.getElementById("Contract").value,
                JoinYear: Number(document.getElementById("JoinYear").value),
                JoinMonth: Number(document.getElementById("JoinMonth").value)
            };

            const response = await fetch("/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            document.getElementById("result").innerText = result.result;

        });
    </script>

</body>
</html>
